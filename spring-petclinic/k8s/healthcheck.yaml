apiVersion: v1
kind: Service
metadata:
  name: ingress-healthcheck
  namespace: default
spec:
  selector:
    app: ingress-healthcheck
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-healthcheck
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-healthcheck
  template:
    metadata:
      labels:
        app: ingress-healthcheck
    spec:
      containers:
        - name: healthcheck
          image: hashicorp/http-echo:1.0
          args:
            - "-text=OK"
            - "-listen=:8080"
          ports:
            - containerPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-healthcheck
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: ingress-healthcheck
                port:
                  number: 80